<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wu Yao-Lin's Profile</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333;
        }

        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .card {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 90%;
            text-align: center;
        }

        .profile-pic {
            width: 120px;
            height: 120px;
            background-color: #ddd;
            border-radius: 50%;
            margin: 0 auto 1.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 50px;
        }

        h1 {
            margin: 0;
            color: var(--primary-color);
            font-size: 1.8rem;
        }

        .japanese-name {
            font-size: 0.9rem;
            color: #888;
            margin-bottom: 1.5rem;
        }

        .info-section {
            text-align: left;
            margin-top: 20px;
        }

        .info-item {
            margin-bottom: 15px;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }

        .label {
            font-weight: bold;
            color: var(--primary-color);
            display: block;
            font-size: 0.9rem;
        }

        .content {
            font-size: 1.1rem;
            margin-top: 5px;
            display: block;
        }

        .lang-jp {
            font-size: 0.8rem;
            color: #666;
            font-style: italic;
        }

        footer {
            margin-top: 20px;
            font-size: 0.8rem;
            color: #aaa;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="profile-pic">👋</div>
        
        <h1>吳耀林</h1>
        <div class="japanese-name">ゴ・ヨウリン (Go Yorin)</div>

        <div class="info-section">
            <div class="info-item">
                <span class="label">🎂 生日 / 誕生日</span>
                <span class="content">2008 / 10 / 23</span>
            </div>

            <div class="info-item">
                <span class="label">🎮 休閒愛好 / 趣味</span>
                <span class="content">玩 Minecraft <br>
                <span class="lang-jp">マインクラフトをすること</span></span>
            </div>

            <div class="info-item">
                <span class="label">🍕 喜愛的食物 / 好きな食べ物</span>
                <span class="content">我不挑食，什麼都喜歡！<br>
                <span class="lang-jp">好き嫌いはありません。何でも好きです！</span></span>
            </div>
        </div>

        <footer>
            Nice to meet you! / よろしくお願いします！
        </footer>
    </div>

</body>
</html>
