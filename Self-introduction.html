<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wu Yao-Lin's Minecraft World</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #333;
            font-family: Arial, sans-serif;
        }

        /* 真正的背景：天空層 */
        #sky-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, #74b9ff, #a29bfe);
            z-index: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 自我介紹卡片 (藏在方塊後面) */
        .card {
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 350px;
            z-index: 2;
            pointer-events: auto;
        }

        /* 方塊牆層 */
        #block-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: grid;
            /* 這裡由 JS 動態生成行列 */
            z-index: 10;
        }

        .block {
            width: 100%;
            height: 100%;
            box-sizing: border-box;
            border: 1px solid rgba(0,0,0,0.1);
            cursor: pointer;
            transition: opacity 0.2s;
            background-size: cover;
            image-rendering: pixelated;
        }

        /* 被破壞後的消失動畫 */
        .broken {
            pointer-events: none;
            opacity: 0;
            transform: scale(0.5) rotate(20deg);
            transition: 0.3s;
        }

        /* 碎裂粒子 */
        .particle {
            position: absolute;
            width: 10px;
            height: 10px;
            pointer-events: none;
            z-index: 100;
        }

        @keyframes explode {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
        }

        .info-label { font-weight: bold; color: #4a90e2; font-size: 0.8rem; display: block; margin-top: 10px;}
    </style>
</head>
<body>

    <div id="sky-bg">
        <div class="card">
            <h2 style="color:#4a90e2; margin-top:0;">吳耀林</h2>
            <p style="font-size:0.8rem; color:#888;">ゴ・ヨウリン</p>
            <div style="text-align:left; display:inline-block;">
                <span class="info-label">🎂 生日</span> 2008 / 10 / 23
                <span class="info-label">🎮 休閒愛好</span> 玩 Minecraft
                <span class="info-label">🍕 愛好的食物</span> 不挑食，什麼都喜歡
            </div>
            <p style="margin-top:20px; font-size:0.7rem; color:#aaa;">恭喜你挖穿了牆壁！👋</p>
        </div>
    </div>

    <div id="block-grid"></div>

    <script>
        const grid = document.getElementById('block-grid');
        const blockSize = 60; // 每個方塊的大小 (像素)
        
        // Minecraft 方塊貼圖 (使用 Base64 或網路代稱，這裡直接用經典泥土與草地色)
        const blockTypes = [
            '#5DAA44', // 草地
            '#8B5A2B', // 泥土
            '#787878'  // 石頭
        ];

        function initGrid() {
            const cols = Math.ceil(window.innerWidth / blockSize);
            const rows = Math.ceil(window.innerHeight / blockSize);
            
            grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
            grid.style.gridTemplateRows = `repeat(${rows}, 1fr)`;

            for (let i = 0; i < cols * rows; i++) {
                const block = document.createElement('div');
                block.classList.add('block');
                
                // 隨機分配方塊顏色 (模擬草地地表與深層泥土)
                const randColor = blockTypes[Math.floor(Math.random() * blockTypes.length)];
                block.style.backgroundColor = randColor;

                // 點擊破壞邏輯
                block.addEventListener('mousedown', function(e) {
                    if (!block.classList.contains('broken')) {
                        breakBlock(block, e.clientX, e.clientY, randColor);
                    }
                });

                grid.appendChild(block);
            }
        }

        function breakBlock(el, x, y, color) {
            el.classList.add('broken');
            
            // 產生碎裂粒子
            for (let i = 0; i < 8; i++) {
                const p = document.createElement('div');
                p.classList.add('particle');
                p.style.backgroundColor = color;
                p.style.left = x + 'px';
                p.style.top = y + 'px';
                
                const dx = (Math.random() - 0.5) * 150;
                const dy = (Math.random() - 0.5) * 150;
                p.style.setProperty('--dx', `${dx}px`);
                p.style.setProperty('--dy', `${dy}px`);
                p.style.animation = 'explode 0.5s ease-out forwards';
                
                document.body.appendChild(p);
                setTimeout(() => p.remove(), 500);
            }
        }

        window.addEventListener('resize', () => {
            grid.innerHTML = '';
            initGrid();
        });

        initGrid();
    </script>
</body>
</html>
