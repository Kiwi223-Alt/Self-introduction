<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wu Yao-Lin's World of Mining</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            /* 經典 Minecraft UI 顏色池 */
            --mc-ui-bg-light: #C6C6C6; 
            --mc-ui-bg-dark: #333333;  
            --mc-ui-border-light: #FFFFFF; 
            --mc-ui-border-dark: #555555;  
            --mc-ui-text-light: #FFFFFF; 
            --mc-ui-text-dark: #333333;  
            
            --mc-dirt: #8B5A2B;
            --mc-grass-top: #5DAA44;
            --mc-stone: #787878;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* 防止視窗產生整體滾動 */
            background-color: #333; /* 挖掘後的深淵背景 */
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif;
            cursor: none; /* 隱藏預設游標 */
        }

        .pixel-font {
            font-family: 'Press Start 2P', cursive;
            image-rendering: pixelated;
        }

        /* --- 天空背景層 (最底層，是用來觸發彩蛋的「空白」區域) --- */
        #sky-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(to bottom, #74b9ff, #a29bfe); 
            z-index: 1; /* 最底層 */
            pointer-events: none; /* 不接受點擊，因為點擊是透過方塊牆的空白處觸發天空層的彩蛋 */
        }

        /* --- 自我介紹卡片層 (層級 5) --- */
        /* 因為內容多，我需要讓這個層可以滾動 */
        #card-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            overflow-y: auto; /* 確保內容太多時可以滾動 */
            z-index: 5; /* 在天空背景上 */
            pointer-events: auto; /* 卡片內容需要被點擊 */
            /* 用於使卡片居中 */
            display: flex;
            justify-content: center;
            align-items: flex-start; /* 從頂部開始排列，防止小螢幕卡片顯示不全 */
            padding-top: 60px; /* 給卡片上下留間距 */
            padding-bottom: 60px;
            box-sizing: border-box;
        }

        .card {
            background: var(--mc-ui-bg-light);
            padding: 1.5rem;
            border: 4px solid #333; 
            border-top-color: var(--mc-ui-border-light);
            border-left-color: var(--mc-ui-border-light);
            box-shadow: 10px 10px 0 rgba(0,0,0,0.5); 
            max-width: 420px;
            width: 90%;
            text-align: center;
            position: relative;
            margin: auto; /* 配合 flex 的居中 */
            box-sizing: border-box;
        }

        .card::after {
            content: '';
            position: absolute;
            top: 4px; left: 4px; right: 4px; bottom: 4px;
            border: 4px solid var(--mc-ui-border-dark);
            border-bottom-color: var(--mc-ui-border-light);
            border-right-color: var(--mc-ui-border-light);
            pointer-events: none;
        }

        h1.card-title {
            margin: 0;
            font-size: 1.2rem;
            color: var(--mc-ui-text-light);
            line-height: 1.
