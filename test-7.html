<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wu Yao-Lin's World of Mining</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --mc-ui-bg-light: #C6C6C6; 
            --mc-ui-bg-dark: #333333;  
            --mc-ui-border-light: #FFFFFF; 
            --mc-ui-border-dark: #555555;  
            --mc-ui-text-light: #FFFFFF; 
            --mc-ui-text-dark: #333333;  
            --mc-dirt: #8B5A2B;
            --mc-grass-top: #5DAA44;
            --mc-stone: #787878;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; 
            background: linear-gradient(to bottom, #74b9ff, #a29bfe); 
            font-family: 'Helvetica Neue', Arial, sans-serif;
            
        }

        .pixel-font {
            font-family: 'Press Start 2P', cursive;
            image-rendering: pixelated;
        }

        /* 介紹卡片層 */
        #card-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center; 
            z-index: 5;
            overflow-y: auto;
        }

        .card {
            background: var(--mc-ui-bg-light);
            padding: 1.5rem;
            border: 4px solid #333; 
            border-top-color: var(--mc-ui-border-light);
            border-left-color: var(--mc-ui-border-light);
            box-shadow: 10px 10px 0 rgba(0,0,0,0.5); 
            max-width: 420px;
            width: 90%;
            text-align: center;
            position: relative;
        }

        .card::after {
            content: '';
            position: absolute;
            top: 4px; left: 4px; right: 4px; bottom: 4px;
            border: 4px solid var(--mc-ui-border-dark);
            border-bottom-color: var(--mc-ui-border-light);
            border-right-color: var(--mc-ui-border-light);
            pointer-events: none;
        }

        h1.card-title {
            margin: 0;
            font-size: 1.2rem;
            color: var(--mc-ui-text-light);
            line-height: 1.5;
            text-shadow: 2px 2px 0 #000, 0 0 5px #000; 
        }

        .japanese-name { font-size: 0.7rem; color: #ddd; margin-top: 5px; display: block; }
        .info-section { text-align: left; margin-top: 15px; color: var(--mc-ui-text-dark); }
        .info-item { margin-bottom: 12px; border-bottom: 2px solid rgba(0,0,0,0.1); padding-bottom: 8px; }
        .label { font-weight: bold; color: var(--mc-dirt); display: block; font-size: 0.75rem; text-transform: uppercase; }
