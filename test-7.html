<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wu Yao-Lin's World of Mining</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            /* 經典 Minecraft UI 顏色池 */
            --mc-ui-bg-light: #C6C6C6; 
            --mc-ui-bg-dark: #333333;  
            --mc-ui-border-light: #FFFFFF; 
            --mc-ui-border-dark: #555555;  
            --mc-ui-text-light: #FFFFFF; 
            --mc-ui-text-dark: #333333;  
            
            --mc-dirt: #8B5A2B;
            --mc-grass-top: #5DAA44;
            --mc-stone: #787878;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; 
            /* 直接將天空漸層設為 body 背景，避免任何黑屏可能 */
            background: linear-gradient(to bottom, #74b9ff, #a29bfe); 
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif;
            cursor: none; 
        }

        .pixel-font {
            font-family: 'Press Start 2P', cursive;
            image-rendering: pixelated;
        }

        /* --- 自我介紹卡片容器 (層級 5) --- */
        #card-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center; /* 垂直水平居中 */
            z-index: 5;
            overflow-y: auto;
        }

        .card {
            background: var(--mc-ui-bg-light);
            padding: 1.5rem;
            border: 4px solid #333; 
            border-top-color: var(--mc-ui-border-light);
